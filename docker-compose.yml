services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustgrade
      POSTGRES_PASSWORD: trustgrade
      POSTGRES_DB: trustgrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustgrade -d trustgrade"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
